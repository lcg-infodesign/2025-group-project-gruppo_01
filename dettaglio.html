    <!-- SCRIPT PER INIZIALIZZARE L'ANNO DALL'URL -->
    <script>
      // Leggi il parametro year dall'URL e imposta selectedYear prima di caricare lo sketch
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const yearParam = urlParams.get('year');
        
        if (yearParam) {
          // Converti il parametro in un formato valido per REFERENDUM_YEARS
          let yearValue = yearParam;
          
          // Gestisci i casi speciali per 2016
          if (yearParam === '2016-1' || yearParam === '2016-2') {
            yearValue = yearParam; // Mantieni come stringa
          } else if (!isNaN(yearParam) && !yearParam.includes('-')) {
            // Se è un numero puro, convertilo in numero
            yearValue = parseInt(yearParam);
          }
          
          // Imposta selectedYear prima che lo sketch venga caricato
          window.__INITIAL_YEAR__ = yearValue;
          console.log('Anno selezionato dall\'URL:', yearParam, '->', yearValue);
        } else {
          console.log('Nessun parametro year nell\'URL, uso default');
        }
      })();
    </script>

    <!-- SCRIPT PER GESTIRE I CLICK SULLE REGIONI -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const regionPaths = document.querySelectorAll('#mappa-regioni .regione');
        
        // --- FUNZIONE DI RESET (Globale) ---
        window.resetToItalia = function() {
            console.log("Eseguo RESET a Italia...");
            
            // 1. Togli la classe 'selected' da tutte le regioni
            regionPaths.forEach(p => p.classList.remove('selected'));
            
            // 2. Avvisa lo sketch JS
            if (window.onRegionSelected) {
                window.onRegionSelected(null);
            } else {
                console.warn("Attenzione: window.onRegionSelected non esiste ancora!");
            }
        };

        // --- GESTIONE TASTO ESC (Priorità Massima) ---
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape" || e.code === "Escape" || e.keyCode === 27) {
                e.preventDefault();
                
                const active = document.querySelector('.regione.selected');
                if (active) {
                    console.log("ESC rilevato con regione attiva -> RESET");
                    window.resetToItalia();
                }
            }
        });

        // --- GESTIONE CLICK SULLE REGIONI ---
        regionPaths.forEach(path => {
          path.addEventListener('click', (e) => {
            e.stopPropagation(); 
            e.stopImmediatePropagation();

            const regionId = path.id;
            const isSelected = path.classList.contains('selected');

            // Reset preventivo
            regionPaths.forEach(p => p.classList.remove('selected'));

            if (isSelected) {
              // Toggle OFF
              if (window.onRegionSelected) window.onRegionSelected(null);
              console.log("Toggle OFF -> Italia");
            } else {
              // Toggle ON
              path.classList.add('selected');
              if (window.onRegionSelected) window.onRegionSelected(regionId);
              console.log("Selezionata:", regionId);
            }
          });
        });

        // --- GESTIONE CLICK FUORI (Sfondo) ---
        document.addEventListener('click', (e) => {
            if (e.target.closest('#navbar') || 
                e.target.closest('#footer') || 
                e.target.closest('.help-controls') ||
                e.target.tagName === 'INPUT' ||
                e.target.tagName === 'BUTTON' ||
                e.target.closest('canvas')) {
                return;
            }

            const active = document.querySelector('.regione.selected');
            if (active) {
                console.log("Click fuori rilevato -> RESET");
                window.resetToItalia();
            }
        });
      });

      // Gestione menu navigazione
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', function(event) {
          navLinks.forEach(l => l.classList.remove('active'));
          this.classList.add('active');
        });
      });
    </script>

    <!-- SCRIPT PER AGGIORNARE LA DATA NELLA NAVBAR -->
    <script>
      const GEOJSON_URL = './REGIONI/regions.geojson';
      
      function updateCurrentDate() {
        const dateElement = document.getElementById('current-date');
        if (dateElement) {
          const now = new Date();
          const daysOfWeek = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
          const months = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 
                         'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
          const dayOfWeek = daysOfWeek[now.getDay()];
          const day = now.getDate();
          const month = months[now.getMonth()];
          const year = now.getFullYear();
          dateElement.textContent = `${dayOfWeek} ${day} ${month} ${year}`;
        }
      }
      
      updateCurrentDate();
    </script>
