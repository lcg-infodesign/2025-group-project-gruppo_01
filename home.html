    <script>
      function updateCurrentDate() {
        const dateElement = document.getElementById('current-date');
        if (dateElement) {
          const now = new Date();
          const daysOfWeek = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
          const months = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 
                         'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
          const dayOfWeek = daysOfWeek[now.getDay()];
          const day = now.getDate();
          const month = months[now.getMonth()];
          const year = now.getFullYear();
          dateElement.textContent = `${dayOfWeek} ${day} ${month} ${year}`;
        }
      }
      updateCurrentDate();

      // Intersection Observer per animazioni
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, {
        threshold: 0.3
      });

      document.querySelectorAll('.section-row').forEach(section => {
        observer.observe(section);
      });

      // Nascondi le frecce quando l'utente scrolla
      const scrollIndicators = document.querySelectorAll('.scroll-indicator');
      let scrollTimeout;
      
      window.addEventListener('scroll', () => {
        scrollIndicators.forEach((indicator, index) => {
          const section = indicator.closest('.section-row');
          if (section) {
            const rect = section.getBoundingClientRect();
            // Nascondi la freccia se la sezione è fuori dalla vista
            if (rect.bottom < 0 || rect.top > window.innerHeight) {
              indicator.classList.add('hidden');
            } else {
              indicator.classList.remove('hidden');
            }
          }
        });
      });

      // Click sulle frecce per scrollare alla sezione successiva
      scrollIndicators.forEach((indicator, index) => {
        indicator.addEventListener('click', () => {
          const sections = document.querySelectorAll('.section-row');
          if (sections[index + 1]) {
            sections[index + 1].scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          }
        });
      });

      const navLinks = document.querySelectorAll('.nav-link');

navLinks.forEach(link => {
  link.addEventListener('click', function(event) {
    // Evita che la pagina si ricarichi se vuoi restare sulla stessa pagina
    // event.preventDefault(); 

    // Rimuovi la classe 'active' da tutti i link
    navLinks.forEach(l => l.classList.remove('active'));

    // Aggiungi la classe 'active' al link cliccato
    this.classList.add('active');
  });
});
