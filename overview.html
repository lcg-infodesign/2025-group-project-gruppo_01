    /** Anno→CSV (stesso mapping del dettaglio). */

      '1946': 'dataset/1-1946.csv', '1974': 'dataset/2-1974.csv', '1978': 'dataset/3-1978.csv',
      '1981': 'dataset/4-1981.csv', '1985': 'dataset/5-1985.csv', '1987': 'dataset/6-1987.csv',

      '1999': 'dataset/13-1999.csv', '2000': 'dataset/14-2000.csv', '2001': 'dataset/15-2001.csv',
      '2003': 'dataset/16-2003.csv', '2005': 'dataset/17-2005.csv', '2006': 'dataset/18-2006.csv',
      '2009': 'dataset/19-2009.csv', '2011': 'dataset/20-2011.csv',
      '2016-1': 'dataset/21-2016.csv', '2016-2': 'dataset/22-2016.csv',
      '2020': 'dataset/23-2020.csv', '2022': 'dataset/24-2022.csv', '2025': 'dataset/25-2025.csv'
    };
    /** Ordine regioni nell'SVG overlay (region-0..19) = ordine in mappa-regioni.svg. */
    const TRANSITION_REGION_ORDER = [
      'TRENTINO', 'PUGLIA', 'BASILICATA', 'EMILIA_ROMAGNA', 'LOMBARDIA', 'FRIULI_VENEZIA_GIULIA',
      'VENETO', 'MARCHE', 'UMBRIA', 'TOSCANA', 'LAZIO', 'MOLISE', 'ABRUZZO', 'CAMPANIA', 'CALABRIA',
      'SICILIA', 'SARDEGNA', 'PIEMONTE', "VAL_D'AOSTA", 'LIGURIA'
    ];

    // --- Colori Basati sull'Immagine ---


    const COLORS = {
      INK: '#1E52A6',
      RAGGIUNTO: '#1E52A6',
      // 🎯 MODIFICA QUI per le barre del grafico
      NON_RAGGIUNTO: '#ADBAD2',
      NON_RICHIESTO: '#F6ECE1',
      BACKGROUND_PAPER: '#F6F0E0',
      LINE_RULE: '#D9D9D9',
      QUORUM_LINE: '#FFB905',
      HOVER_HIGHLIGHT: '#FFB905' // Oro brillante per l'
    };
    // ...

    // Raggio di curvatura per le barre (Top & Bottom)
    const BAR_RADIUS = 12;
    // Offset e Margini (stessa larghezza della timeline footer per allineamento colonne-quadratini)
    const CHART_PADDING = 100;
    const TOP_MARGIN = 180;
    const BOTTOM_MARGIN = 120;
    const TIMELINE_MAX_WIDTH = 1400; // deve coincidere con #year-slider-container max-width 

    // Costante per la dimensione del marker quadrato sulla timeline
    const TIMELINE_SQUARE_SIZE = 20;

    // Variabile per l'omino SVG come testo
    let ominoSvgText;
    let ominoImage;

    function preload() {
      bg = loadImage("img/background.png");
      // Carica l'SVG come testo per poterlo modificare
      ominoSvgText = loadStrings("omino1.svg");
    }

    // Cache per le immagini colorate già create
    let ominoImageCache = {};

    // Funzione per creare un'immagine SVG colorata
    function createColoredOmino(fillColor, strokeColor = null, strokeWidth = 0) {
      if (!ominoSvgText) return null;

      // Crea una chiave per la cache basata sui colori
      let cacheKey = hex(red(fillColor), 2) + hex(green(fillColor), 2) + hex(blue(fillColor), 2);
      if (strokeColor) {
        cacheKey += '_' + hex(red(strokeColor), 2) + hex(green(strokeColor), 2) + hex(blue(strokeColor), 2) + '_' + strokeWidth;
      }

      // Se l'immagine è già in cache, restituiscila
      if (ominoImageCache[cacheKey]) {
        return ominoImageCache[cacheKey];
      }

      // Converte l'array di stringhe in un'unica stringa
      let svgText = ominoSvgText.join('\n');

      // Converte il colore p5.js in formato hex
      let hexColor = '#' + hex(red(fillColor), 2) + hex(green(fillColor), 2) + hex(blue(fillColor), 2);

      // Sostituisce il colore fill nel path principale (il corpo dell'omino)
      // Il primo path contiene il corpo dell'omino, sostituiamo solo quello
      svgText = svgText.replace(/<path d="M31.6699[^>]*fill="#[^"]*"/, (match) => {
        return match.replace(/fill="#[^"]*"/, `fill="${hexColor}"`);
      });

      // Se l'omino è bianco, cambia occhi e bocca in blu
      if (red(fillColor) === 255 && green(fillColor) === 255 && blue(fillColor) === 255) {
        let blueColor = COLORS.INK; // #1E52A6
        let blueHex = '#1E52A6';

        // Cambia gli occhi (i due rect con fill="white") in blu
        svgText = svgText.replace(/<rect[^>]*fill="white"/g, (match) => {
          return match.replace(/fill="white"/, `fill="${blueHex}"`);
        });

        // Cambia la bocca (il path con stroke="white") in blu
        svgText = svgText.replace(/<path d="M16.5889[^>]*stroke="white"/g, (match) => {
          return match.replace(/stroke="white"/, `stroke="${blueHex}"`);
        });
      }

      // Se c'è un bordo, aggiungi stroke al path principale
      if (strokeColor && strokeWidth > 0) {
        let strokeHex = '#' + hex(red(strokeColor), 2) + hex(green(strokeColor), 2) + hex(blue(strokeColor), 2);

        // Aggiungi padding al viewBox per evitare che lo stroke venga tagliato
        // Il padding deve essere almeno la metà dello stroke-width
        let padding = Math.ceil(strokeWidth / 2) + 1; // Aggiungi 1px extra per sicurezza
        svgText = svgText.replace(/viewBox="([^"]*)"/, (match, viewBox) => {
          let parts = viewBox.split(' ');
          if (parts.length === 4) {
            let x = parseFloat(parts[0]) - padding;
            let y = parseFloat(parts[1]) - padding;
            let width = parseFloat(parts[2]) + (padding * 2);
            let height = parseFloat(parts[3]) + (padding * 2);
            return `viewBox="${x} ${y} ${width} ${height}"`;
          }
          return match;
        });

        // Trova il path principale e aggiungi/modifica stroke con linejoin e linecap per evitare tagli
        svgText = svgText.replace(/<path d="M31.6699([^>]*)>/, (match, attrs) => {
          if (!attrs.includes('stroke=')) {
            return `<path stroke="${strokeHex}" stroke-width="${strokeWidth}" stroke-linejoin="round" stroke-linecap="round" d="M31.6699${attrs}>`;
          } else {
            // Rimuovi eventuali attributi stroke esistenti e aggiungi quelli corretti
            let newAttrs = attrs.replace(/stroke="[^"]*"/g, '').replace(/stroke-width="[^"]*"/g, '').replace(/stroke-linejoin="[^"]*"/g, '').replace(/stroke-linecap="[^"]*"/g, '');
            return `<path stroke="${strokeHex}" stroke-width="${strokeWidth}" stroke-linejoin="round" stroke-linecap="round" d="M31.6699${newAttrs}>`;
          }
        });
      }

      // Crea un data URL dall'SVG modificato
      let svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
      let url = URL.createObjectURL(svgBlob);

      // Carica l'immagine dal blob URL
      let img = loadImage(url, (loadedImg) => {
        // Immagine caricata con successo
      }, () => {
        // Errore nel caricamento
        console.error('Errore nel caricamento dell\'omino colorato');
      });

      // Salva nella cache
      ominoImageCache[cacheKey] = img;

      return img;
    }

    // Funzione helper per convertire numero in hex a 2 cifre
    function hex(num, len) {
      let str = Math.round(num).toString(16);
      while (str.length < len) str = '0' + str;
      return str;
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      textFont('sans-serif');

      // Pre-crea le immagini colorate degli omini dopo che l'SVG è stato caricato
      if (ominoSvgText) {
        // Crea le tre versioni colorate
        ominoImageCache['raggiunto'] = createColoredOmino(COLORS.RAGGIUNTO, color(255, 255, 255), 2);
        ominoImageCache['non_raggiunto'] = createColoredOmino(COLORS.NON_RAGGIUNTO, null, 0);
        ominoImageCache['non_richiesto'] = createColoredOmino(color(255, 255, 255), COLORS.INK, 2);
      }

      years = [
        '1946', '1974', '1978', '1981', '1985', '1987', '1989', '1990', '1991', '1993',
        '1995', '1997', '1999', '2000', '2001', '2003', '2005', '2006', '2009', '2011',
        '2016(1)', '2016(2)', '2020', '2022', '2025'
      ];

      affluenceData = [
        88.82, 87.7, 81.2, 79.4, 77.96, 65.11, 80.31, 43.13, 62.50, 76.81,
        57.49, 30.16, 49.58, 32.17, 34.05, 25.87, 25.98, 53.84, 23.70, 57.03,
        32.16, 68.49, 53.84, 20.93, 30.59
      ];

      const quorumStatesList = [
        'NON_RICHIESTO', 'RAGGIUNTO', 'RAGGIUNTO', 'RAGGIUNTO', 'RAGGIUNTO',
        'RAGGIUNTO', 'NON_RICHIESTO', 'NON_RAGGIUNTO', 'RAGGIUNTO', 'RAGGIUNTO',
        'RAGGIUNTO', 'NON_RAGGIUNTO', 'NON_RAGGIUNTO', 'NON_RAGGIUNTO', 'NON_RICHIESTO',
        'NON_RAGGIUNTO', 'NON_RAGGIUNTO', 'NON_RICHIESTO', 'NON_RAGGIUNTO', 'RAGGIUNTO',
        'NON_RAGGIUNTO', 'NON_RICHIESTO', 'NON_RICHIESTO', 'NON_RAGGIUNTO', 'NON_RAGGIUNTO'
      ];

      for (let i = 0; i < years.length; i++) {
        quorumStatus[years[i]] = quorumStatesList[i].trim().replace(/\s/g, '_');
      }
    }

    function draw() {
      background(245, 240, 220);

      // --- Gestione transizione click colonna → mappa → dettaglio ---
      if (transitionPhase === 'barsSliding' || transitionPhase === 'fragmentToMap' || transitionPhase === 'navigate') {
        updateTransition();
        const canvasElement = document.querySelector('canvas');
        if (canvasElement) canvasElement.style.cursor = 'default';
        return;
      }

      // 1. Logica Hover (solo quando non in transizione)
      updateHoverState();
      const canvasElement = document.querySelector('canvas');
      if (canvasElement) {
        if (hoveredIndex !== -1) {
          canvasElement.style.cursor = 'pointer';
        } else {
          canvasElement.style.cursor = 'default';
        }
      }

      // 2. Disegno
      drawHistogram();
      drawHoverInfo();
    }

    /** Colore CSS per affluenza (stessa logica del dettaglio: blu con alpha 0–100%). */
    function getColorCss(affluenza) {
      if (affluenza == null || !isFinite(affluenza)) return 'rgba(200,200,200,0.5)';
      const norm = Math.max(0, Math.min(1, affluenza / 100));
      return 'rgba(30, 82, 166, ' + norm + ')';
    }

    /** Normalizza nome regione CSV → chiave usata nella mappa (come in dettaglio). */
    function normalizeRegionKey(name) {
      let n = (name || '').trim().toUpperCase().replace(/\s+/g, '_');
      if (n === "TRENTINO-ALTO_ADIGE" || n === "TRENTINO_ALTO_ADIGE") return 'TRENTINO';
      if (n === "VALLE_D'AOSTA" || n === "VAL_D'AOSTA") return "VAL_D'AOSTA";
      if (n === "FRIULI-VENEZIA_GIULIA" || n === "FRIULI_VENEZIA_GIULIA") return 'FRIULI_VENEZIA_GIULIA';
      if (n === "EMILIA-ROMAGNA" || n === "EMILIA_ROMAGNA") return 'EMILIA_ROMAGNA';
      return n;
    }

    /** Carica CSV per l'anno e popola transitionRegionAffluenza (affluenza per regione). */
    function loadTransitionMapData(yearParam) {
      const csvPath = REFERENDUM_YEARS_OVERVIEW[yearParam];
      if (!csvPath) return;
      transitionRegionAffluenza = null;
      fetch(csvPath)
        .then(function (r) { return r.text(); })
        .then(function (text) {
          const rows = [];
          const lines = text.split(/\r?\n/);
          if (lines.length < 2) return;
          const header = lines[0].split(',').map(function (c) { return c.trim(); });
          const regIdx = header.findIndex(function (h) { return /REGIONE/i.test(h); });
          const affIdx = header.findIndex(function (h) { return /AFFLUENZA/i.test(h); });
          if (regIdx < 0 || affIdx < 0) return;
          for (let i = 1; i < lines.length; i++) {
            const row = parseCSVLine(lines[i]);
            if (row.length <= Math.max(regIdx, affIdx)) continue;
            const regione = (row[regIdx] || '').trim();
            const affStr = (row[affIdx] || '').trim().replace(/%/g, '').replace(/,/g, '.');
            if (!regione || regione.toUpperCase().indexOf('TOTAL') < 0) continue;
            const regionName = regione.replace(/\s*Total\s*$/i, '').trim();
            const aff = parseFloat(affStr);
            if (!isFinite(aff)) continue;
            const key = normalizeRegionKey(regionName);
            if (!rows.some(function (r) { return r.key === key; })) rows.push({ key: key, aff: aff });
          }
          const out = {};
          rows.forEach(function (r) { out[r.key] = r.aff; });
          transitionRegionAffluenza = out;
        })
        .catch(function () {});
    }

    function parseCSVLine(line) {
      const out = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQuotes = !inQuotes; continue; }
        if (!inQuotes && c === ',') { out.push(cur); cur = ''; continue; }
        cur += c;
      }
      out.push(cur);
      return out;
    }

    /** Applica i colori (affluenza per regione) ai path della mappa di transizione. */
    function applyTransitionMapColors() {
      if (!transitionRegionAffluenza) return;
      const svgEl = document.getElementById('transition-italy-svg');
      if (!svgEl) return;
      for (let i = 0; i < NUM_REGIONI && i < TRANSITION_REGION_ORDER.length; i++) {
        const path = svgEl.querySelector('#region-' + i);
        const regionName = TRANSITION_REGION_ORDER[i];
        const aff = transitionRegionAffluenza[regionName] != null ? transitionRegionAffluenza[regionName] : transitionRegionAffluenza[regionName.replace(/_/g, ' ')];
        if (path) path.setAttribute('fill', getColorCss(aff));
      }
    }

    /** Calcola offset X per ogni barra durante lo slide (negative a sinistra, positive a destra). */
    function getBarOffsetsForSlide() {
      const elapsed = Date.now() - transitionStartTime;
      const t = Math.min(1, elapsed / SLIDE_DURATION_MS);
      const easeOut = 1 - Math.pow(1 - t, 1.8);
      const barOffsets = [];
      for (let i = 0; i < numReferendums; i++) {
        if (i < clickedBarIndex) barOffsets.push(-width * easeOut);
        else if (i > clickedBarIndex) barOffsets.push(width * easeOut);
        else barOffsets.push(0);
      }
      return { barOffsets, t };
    }

    /** Aggiorna e disegna la transizione (slide → frammentazione → mappa → navigate). */
    function updateTransition() {
      const now = Date.now();
      const overlay = document.getElementById('transition-overlay');

      if (transitionPhase === 'barsSliding') {
        const { barOffsets, t } = getBarOffsetsForSlide();
        drawHistogram(barOffsets);
        if (t >= 1) {
          transitionPhase = 'fragmentToMap';
          transitionStartTime = now;
          regionBoundsScreen = null;
          const mapWrap = document.getElementById('transition-map-wrap');
          if (mapWrap) {
            // Stesse dimensioni della mappa in dettaglio (drawGeoMap: 34% larghezza, altezza disponibile)
            const navbarHeight = 100;
            const sliderHeight = 130;
            const cardHeight = height - navbarHeight - sliderHeight;
            const sectionStartY = navbarHeight + 20;
            const availableTop = sectionStartY + 30;
            const availableBottom = navbarHeight + cardHeight - 3;
            const totalAvailableHeight = availableBottom - availableTop;
            const drawH = totalAvailableHeight - 20;
            const mapW = width * 0.34;
            mapWrap.style.width = mapW + 'px';
            mapWrap.style.height = Math.max(150, drawH) + 'px';
          }
          if (overlay) {
            overlay.style.display = 'block';
            overlay.style.pointerEvents = 'none';
          }
        }
        return;
      }

      if (transitionPhase === 'fragmentToMap') {
        // Posizione e dimensioni della barra selezionata (stesso calcolo di drawHistogram)
        let chartWidth = Math.min(width, TIMELINE_MAX_WIDTH);
        let chartX = (width - chartWidth) / 2;
        let chartY = TOP_MARGIN - 10;
        let chartHeight = height - TOP_MARGIN - BOTTOM_MARGIN;
        let baselineY = chartY + chartHeight;
        const yearToPosition = {};
        years.forEach((y, idx) => {
          yearToPosition[y] = (years.length > 1) ? (idx / (years.length - 1)) * 100 : 0;
        });
        const barWidthPercent = 2.4;
        const barWidth = (chartWidth * barWidthPercent) / 100;
        const percentage = yearToPosition[years[clickedBarIndex]];
        const barX = chartX + (percentage / 100) * chartWidth - barWidth / 2;
        const barHeight = (affluenceData[clickedBarIndex] / 100) * chartHeight;
        const barTopY = baselineY - barHeight;

        // Alla prima frame: calcola bounds delle 20 regioni in coordinate canvas (ritenta se layout non pronto)
        if (regionBoundsScreen === null) {
          const svgEl = document.getElementById('transition-italy-svg');
          const wrapEl = document.getElementById('transition-map-wrap');
          const canvasEl = document.querySelector('canvas');
          if (svgEl && wrapEl && canvasEl) {
            const wrapRect = wrapEl.getBoundingClientRect();
            const canvasRect = canvasEl.getBoundingClientRect();
            if (wrapRect.width > 0 && wrapRect.height > 0) {
              const scale = wrapRect.width / 409;
              regionBoundsScreen = [];
              for (let i = 0; i < NUM_REGIONI; i++) {
                const path = svgEl.querySelector('#region-' + i);
                if (path && typeof path.getBBox === 'function') {
                  const b = path.getBBox();
                  regionBoundsScreen.push({
                    x: wrapRect.left - canvasRect.left + b.x * scale,
                    y: wrapRect.top - canvasRect.top + b.y * scale,
                    w: b.width * scale,
                    h: b.height * scale
                  });
                } else {
                  regionBoundsScreen.push({ x: width / 2 - 10, y: height / 2 - 10, w: 20, h: 20 });
                }
              }
            }
          }
          if (regionBoundsScreen === null) {
            regionBoundsScreen = [];
            for (let i = 0; i < NUM_REGIONI; i++) {
              regionBoundsScreen.push({ x: width / 2 - 10, y: height / 2 - 10, w: 20, h: 20 });
            }
          }
        }

        const elapsed = now - transitionStartTime;
        const t = Math.min(1, elapsed / FRAGMENT_TO_MAP_DURATION_MS);
        const easeOut = 1 - Math.pow(1 - t, 1.15);

        const barColor = getBarColor(years[clickedBarIndex]);
        const barColorP5 = color(barColor);
        noStroke();

        // La colonna si spezzetta in 20 pezzi (uno per regione): ogni pezzo parte da una fetta della barra e vola verso la regione
        const stripW = barWidth / NUM_REGIONI;
        for (let i = 0; i < NUM_REGIONI && i < regionBoundsScreen.length; i++) {
          const startX = barX + i * stripW;
          const startY = barTopY;
          const startW = stripW;
          const startH = barHeight;
          const end = regionBoundsScreen[i];
          const x = startX + (end.x - startX) * easeOut;
          const y = startY + (end.y - startY) * easeOut;
          const w = startW + (end.w - startW) * easeOut;
          const h = startH + (end.h - startH) * easeOut;
          fill(barColorP5);
          const r = Math.min(BAR_RADIUS, w / 2, h / 2);
          rect(x, y, w, h, r, r, r, r);
        }

        // Applica colori affluenza (stessa mappa del dettaglio per quell'anno)
        applyTransitionMapColors();
        // Quando i frammenti sono arrivati: mostra la mappa piena e passa a navigate
        if (overlay) overlay.style.opacity = t >= 1 ? '1' : '0';
        if (t >= 1) {
          transitionPhase = 'navigate';
          transitionStartTime = now;
        }
        return;
      }

      if (transitionPhase === 'navigate') {
        const elapsed = now - transitionStartTime;
        if (overlay) overlay.style.opacity = '1';
        if (elapsed >= MAP_HOLD_BEFORE_NAVIGATE_MS) {
          transitionPhase = 'idle';
          window.location.href = 'dettaglio.html?year=' + encodeURIComponent(transitionYearParam);
        }
      }
    }

    /**
     * Aggiorna l'indice della colonna su cui si sta passando il mouse.
     * L'hover è attivo solo quando il mouse è sopra il rettangolo effettivo della barra.
     */
    function updateHoverState() {
      let chartWidth = Math.min(width, TIMELINE_MAX_WIDTH);
      let chartX = (width - chartWidth) / 2;
      let chartY = TOP_MARGIN - 10;
      let chartHeight = height - TOP_MARGIN - BOTTOM_MARGIN;
      let baselineY = chartY + chartHeight;

      // Stesse posizioni usate in drawHistogram()
      const yearToPosition = {};
      years.forEach((year, index) => {
        const position = (years.length > 1)
          ? (index / (years.length - 1)) * 100
          : 0;
        yearToPosition[year] = position;
      });

      const barWidthPercent = 2.4;
      const barWidth = (chartWidth * barWidthPercent) / 100;

      hoveredIndex = -1;
      for (let i = 0; i < numReferendums; i++) {
        const percentage = yearToPosition[years[i]];
        const x = chartX + (percentage / 100) * chartWidth - barWidth / 2;
        const affluence = affluenceData[i];
        const barHeight = (affluence / 100) * chartHeight;
        const barTopY = baselineY - barHeight;

        // Hover solo se il mouse è dentro il rettangolo della barra
        if (mouseX >= x && mouseX <= x + barWidth && mouseY >= barTopY && mouseY <= baselineY) {
          hoveredIndex = i;
          break;
        }
      }
    }





    function drawPaperBackground() {
      noStroke();                          // niente bordo
      fill(245, 240, 220, 90);             // colore con alpha (trasparenza)
      rect(0, 0, width, height);
      background(bg)         // rettangolo che copre tutto il canvas
    }

    function drawLegend() {
      const legendX = width - CHART_PADDING - 220; // posizione X della legenda
      let legendY = TOP_MARGIN - 35;               // posizione Y iniziale
      const spacing = 30;                          // spazio tra le voci
      const markerX = legendX + 10;
      // posizione X dei marker

      // Oggetti della legenda
      const legendItems = [
        { text: 'Quorum non richiesto', color: COLORS.NON_RICHIESTO },
        { text: 'Quorum non raggiunto', color: COLORS.NON_RAGGIUNTO },
        { text: 'Quorum raggiunto', color: COLORS.RAGGIUNTO }
      ];

      textSize(19);
      textFont('STIX Two Text', 'serif');
      textAlign(LEFT, LEFT);

      for (let i = 0; i < legendItems.length; i++) {
        let item = legendItems[i];
        let y = legendY + i * spacing;

        // Disegna testo
        fill(COLORS.INK);
        noStroke();
        text(item.text, markerX + 20, y + 7);

        fill(item.color);
        stroke(COLORS.INK);
        strokeWeight(1);
        rectMode(CENTER);
        rect(markerX, y + 8, 12, 12, 3);
        rectMode(CORNER);
      }
    }

    function getBarColor(year) {
      const status = quorumStatus[year];
      if (status === 'RAGGIUNTO') return COLORS.RAGGIUNTO;
      else if (status === 'NON_RAGGIUNTO') return COLORS.NON_RAGGIUNTO;
      else return COLORS.NON_RICHIESTO;
    }




    /** @param {number[]} [barOffsets] - offset X per ogni barra (es. durante slide transizione) */
    function drawHistogram(barOffsets) {
      let chartWidth = Math.min(width, TIMELINE_MAX_WIDTH);
      let chartX = (width - chartWidth) / 2;
      let chartY = TOP_MARGIN - 10;
      let chartHeight = height - TOP_MARGIN - BOTTOM_MARGIN;
      let baselineY = chartY + chartHeight;


      // Calculate positions aligned with timeline dots (uniform distribution)
      const yearToPosition = {};
      years.forEach((year, index) => {
        const position = (years.length > 1)
          ? (index / (years.length - 1)) * 100
          : 0;
        yearToPosition[year] = position;
      });

      const quorumY = baselineY - (50 / 100) * chartHeight;
      if (!barOffsets) {
        stroke(COLORS.QUORUM_LINE);
        strokeWeight(3);
        line(chartX, quorumY, chartX + chartWidth, quorumY);
        textFont('STIX Two Text', 'serif');
        textSize(34);
        textAlign(RIGHT, CENTER);
        push();
        noStroke();
        fill(COLORS.QUORUM_LINE);
        text('50+1', chartX + chartWidth + 10, quorumY - 22);
        pop();
        textSize(22);
        push();
        noStroke();
        fill(COLORS.QUORUM_LINE);
        text('QUORUM', chartX + chartWidth + 10, quorumY + 22);
        pop();
      }

      // Bar width as percentage of chart width
      const barWidthPercent = 2.4;
      const barWidth = (chartWidth * barWidthPercent) / 100;

      for (let i = 0; i < numReferendums; i++) {
        const offsetX = (barOffsets && barOffsets[i]) ? barOffsets[i] : 0;
        const percentage = yearToPosition[years[i]];
        const x = chartX + (percentage / 100) * chartWidth - barWidth / 2 + offsetX;

        let affluence = affluenceData[i];
        let barHeight = (affluence / 100) * chartHeight;
        let barTopY = baselineY - barHeight;
        let barColor = getBarColor(years[i]);

        if (barColor === COLORS.NON_RICHIESTO || barColor === COLORS.NON_RAGGIUNTO) {
          fill(barColor);
          stroke(COLORS.INK);
          strokeWeight(1.5);
        } else {
          fill(barColor);
          noStroke();
        }

        rect(x, barTopY, barWidth, barHeight, BAR_RADIUS, BAR_RADIUS, BAR_RADIUS, BAR_RADIUS);

        if (!barOffsets && hoveredIndex === i) {
          push();
          noFill();
          stroke(COLORS.HOVER_HIGHLIGHT);
          strokeWeight(4);
          rect(
            x - 2,
            barTopY - 2,
            barWidth + 4,
            barHeight + 4,
            BAR_RADIUS
          );
          pop();
        }
      }
    }



    function drawTimeline() {
      let chartX = CHART_PADDING;
      let chartWidth = width - 2 * CHART_PADDING;
      let totalBarWidth = chartWidth / numReferendums;
      let baselineY = TOP_MARGIN + (height - TOP_MARGIN - BOTTOM_MARGIN);
      let timelineY = baselineY + 0;

      stroke(COLORS.INK);
      strokeWeight(2);
      line(chartX, timelineY, chartX + chartWidth, timelineY);

      for (let i = 0; i < numReferendums; i++) {
        let x = chartX + i * totalBarWidth + totalBarWidth / 2;
        let barColor = getBarColor(years[i]);

        let markerSize = 20;
        let squareSize = TIMELINE_SQUARE_SIZE;

        fill(barColor);
        stroke(COLORS.INK);
        strokeWeight(1);
        rectMode(CENTER);
        rect(x, timelineY + 20, squareSize, squareSize, 5, 5, 5, 5);
        rectMode(CORNER);

        if (hoveredIndex === i) markerSize = 12;

        if (quorumStatus[years[i]] === 'RAGGIUNTO') {
          fill(COLORS.INK);
          noStroke();
          circle(x, timelineY, markerSize);
        } else {
          noFill(COLORS.BACKGROUND_PAPER);
          stroke(COLORS.INK);
          strokeWeight(2);
          circle(x, timelineY, markerSize);
        }
      }
    }

    function drawHoverInfo() {
      if (hoveredIndex === -1) return;

      let chartWidth = Math.min(width, TIMELINE_MAX_WIDTH);
      let chartX = (width - chartWidth) / 2;
      let chartY = TOP_MARGIN - 10;
      let chartHeight = height - TOP_MARGIN - BOTTOM_MARGIN;
      let baselineY = chartY + chartHeight;

      // Calcolo posizioni identico a drawHistogram()
      const yearToPosition = {};
      years.forEach((year, index) => {
        const position = (years.length > 1)
          ? (index / (years.length - 1)) * 100
          : 0;
        yearToPosition[year] = position;
      });

      let i = hoveredIndex;
      let affluence = affluenceData[i];

      // === STESSA LARGHEZZA BARRA DELL'ISTOGRAMMA ===
      const barWidthPercent = 2.4;
      const barWidth = (chartWidth * barWidthPercent) / 100;

      // === STESSO CALCOLO X DELL'ISTOGRAMMA ===
      const percentage = yearToPosition[years[i]];
      const x = chartX + (percentage / 100) * chartWidth - barWidth / 2;
      const centerX = x + barWidth / 2;

      // Altezza barra
      let barHeight = (affluence / 100) * chartHeight;
      let barTopY = baselineY - barHeight;

      // Linea tratteggiata
      stroke(COLORS.INK);
      strokeWeight(1.5);
      drawingContext.setLineDash([6, 6]);
      line(centerX, barTopY, centerX, barTopY - 20);
      drawingContext.setLineDash([]);

      // Percentuale (senza ombre o effetti)
      push();
      drawingContext.shadowBlur = 0;
      drawingContext.shadowColor = 'rgba(0,0,0,0)';
      drawingContext.shadowOffsetX = 0;
      drawingContext.shadowOffsetY = 0;
      drawingContext.filter = 'none';
      drawingContext.globalCompositeOperation = 'source-over';

      fill(COLORS.INK);
      noStroke();
      textFont('STIX Two Text');
      textSize(25);
      textAlign(CENTER, CENTER);
      textStyle(NORMAL);

      text(`${affluence.toFixed(2)}%`, centerX, barTopY - 30);
      pop();
    }

    function mouseMoved() {
      redraw();
    }

    function mousePressed() {
      if (mouseButton !== LEFT) return;
      if (transitionPhase !== 'idle') return;

      // Verifica se il click è su una barra dell'istogramma (hoveredIndex calcolato da updateHoverState)
      if (hoveredIndex !== -1) {
        const year = years[hoveredIndex];
        let yearParam = year;
        if (year === "2016(1)") yearParam = "2016-1";
        else if (year === "2016(2)") yearParam = "2016-2";

        console.log('✅ Click su barra istogramma per anno:', year, '- avvio transizione verso dettaglio');

        transitionPhase = 'barsSliding';
        transitionStartTime = Date.now();
        clickedBarIndex = hoveredIndex;
        transitionYearParam = yearParam;
        transitionRegionAffluenza = null;
        loadTransitionMapData(yearParam);
      }
    }


    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }


  </script>


  <script>
    function updateCurrentDate() {
      const dateElement = document.getElementById('current-date');
      if (dateElement) {
        const now = new Date();
        const daysOfWeek = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
        const months = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
          'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
        const dayOfWeek = daysOfWeek[now.getDay()];
        const day = now.getDate();
        const month = months[now.getMonth()];
        const year = now.getFullYear();
        dateElement.textContent = `${dayOfWeek} ${day} ${month} ${year}`;
      }
    }
    updateCurrentDate();

    // Intersection Observer per animazioni
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, {
      threshold: 0.3
    });

    document.querySelectorAll('.section-row').forEach(section => {
      observer.observe(section);
    });

    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
      link.addEventListener('click', function (event) {
        // Evita che la pagina si ricarichi se vuoi restare sulla stessa pagina
        // event.preventDefault(); 

        // Rimuovi la classe 'active' da tutti i link
        navLinks.forEach(l => l.classList.remove('active'));

        // Aggiungi la classe 'active' al link cliccato
        this.classList.add('active');
      });
    });

    // ---------- Intro overview: al click sull'omino si sposta a sinistra e "seleziona un anno" compare a destra lettera per lettera ----------
    (function () {
      const INTRO_PHRASE = "seleziona un anno";
      const introBlock = document.getElementById('intro-top-right');
      const introOminoWrap = document.getElementById('intro-omino-wrap');
      const introClickHint = document.getElementById('intro-click-hint');
      const introTextEl = document.getElementById('intro-text');
      const letterDelayMs = 80;

      if (!introBlock || !introOminoWrap || !introTextEl) return;

      function toggleIntro() {
        if (introBlock.classList.contains('expanded')) {
          introBlock.classList.remove('expanded');
          return;
        }
        introBlock.classList.add('expanded');

        // Costruisci il testo lettera per lettera solo al primo click (spazi con classe .space per separare le parole)
        if (introTextEl.children.length === 0) {
          INTRO_PHRASE.split('').forEach(function (char, i) {
            const span = document.createElement('span');
            span.className = char === ' ' ? 'letter space' : 'letter';
            span.textContent = char;
            span.style.animationDelay = (i * letterDelayMs) + 'ms';
            introTextEl.appendChild(span);
          });
        }
      }

      function attachTrigger(el) {
        if (!el) return;
        el.addEventListener('click', function (e) {
          e.stopPropagation();
          toggleIntro();
        });
        el.addEventListener('touchend', function (e) {
          e.preventDefault();
          toggleIntro();
        }, { passive: false });
      }
      attachTrigger(introOminoWrap);
      attachTrigger(introClickHint);
    })();

  </script>

  <!-- Timeline footer (same as dettaglio.html) -->
  <div id="footer"
    style="position:fixed; bottom:40px; left:0; right:0; height:80px; background-color:#f5f0dc; z-index:10000; display:flex; align-items:center; padding:0px;">
    <div id="year-slider-container" style="position:relative; width:100%; max-width:1400px; margin:0 auto;">
      <div style="position:relative; height:40px; display:flex; align-items:center;">
        <div id="timeline-line"
          style="position:absolute; left:0; right:0; height:4px; background-color:#0F3D88 !important; top:50%; transform:translateY(-50%); z-index:10; pointer-events:none; opacity:1 !important; display:block !important; visibility:visible !important;">
        </div>
        <div id="year-dots" style="position:relative; width:100%; height:100%; z-index:15; min-height:40px;"></div>
        <input type="range" id="year-slider" min="0" max="100" value="100" step="0.01"
          style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; z-index:5;">
      </div>
    </div>
  </div>

  <script>
    // Timeline setup for overview - adapted from sketch_dettaglio.js
    let selectedYearOverview = null; // No default selected year

    // Convert overview year format to internal format for quorum lookup
    function getYearKeyForQuorum(displayYear) {
      if (displayYear === '2016(1)') return '2016-1';
      if (displayYear === '2016(2)') return '2016-2';
      return displayYear;
    }

    // Quorum status mapping (same as dettaglio)
    const quorumStatusByYear = {
      '1946': 'NON_RICHIESTO',
      '1974': 'RAGGIUNTO',
      '1978': 'RAGGIUNTO',
      '1981': 'RAGGIUNTO',
      '1985': 'RAGGIUNTO',
      '1987': 'RAGGIUNTO',
      '1989': 'NON_RICHIESTO',
      '1990': 'NON_RAGGIUNTO',
      '1991': 'RAGGIUNTO',
      '1993': 'RAGGIUNTO',
      '1995': 'RAGGIUNTO',
      '1997': 'NON_RAGGIUNTO',
      '1999': 'NON_RAGGIUNTO',
      '2000': 'NON_RAGGIUNTO',
      '2001': 'NON_RICHIESTO',
      '2003': 'NON_RAGGIUNTO',
      '2005': 'NON_RAGGIUNTO',
      '2006': 'NON_RICHIESTO',
      '2009': 'NON_RAGGIUNTO',
      '2011': 'RAGGIUNTO',
      '2016-1': 'NON_RAGGIUNTO',
      '2016-2': 'NON_RICHIESTO',
      '2020': 'NON_RICHIESTO',
      '2022': 'NON_RAGGIUNTO',
      '2025': 'NON_RAGGIUNTO'
    };

    function setupYearSliderOverview() {
      const slider = document.getElementById('year-slider');
      const yearDots = document.getElementById('year-dots');

      if (!slider || !yearDots) return;

      // Use years array from overview
      const overviewYears = years; // ['1946', '1974', ..., '2016(1)', '2016(2)', ...]

      // Calculate uniform positions
      const yearToPosition = {};
      overviewYears.forEach((year, index) => {
        const position = (overviewYears.length > 1)
          ? (index / (overviewYears.length - 1)) * 100
          : 0;
        yearToPosition[year] = position;
      });

      // Set slider
      slider.min = 0;
      slider.max = 100;
      slider.step = 0.01;

      // Find current year position - start at 0 if no year selected (instead of 100 to avoid auto-selecting 2025)
      const currentPosition = selectedYearOverview ? yearToPosition[selectedYearOverview] : 0;
      slider.value = currentPosition;

      // Don't trigger selection on initial load - only on user interaction

      // Function to find closest year
      const findClosestYear = (position) => {
        let closestYear = overviewYears[0];
        let minDistance = Infinity;

        overviewYears.forEach((year) => {
          const yearPos = yearToPosition[year];
          const distance = Math.abs(position - yearPos);
          if (distance < minDistance) {
            minDistance = distance;
            closestYear = year;
          }
        });

        return closestYear;
      };


      // Create dots
      const createDots = () => {
        yearDots.innerHTML = '';

        // Create timeline line directly in year-dots container
        const line = document.createElement('div');
        line.style.cssText = 'position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 3px; width: 100%; background-color: #0F3D88; z-index: 1; pointer-events: none; opacity: 1; display: block; visibility: visible;';
        yearDots.appendChild(line);

        console.log('Timeline line created, yearDots:', yearDots);

        overviewYears.forEach((year, index) => {
          const dotContainer = document.createElement('div');
          dotContainer.setAttribute('data-year-key', year);
          dotContainer.style.position = 'absolute';
          const percentage = yearToPosition[year];
          dotContainer.style.left = `${percentage}%`;
          dotContainer.style.top = '50%';
          dotContainer.style.transform = 'translate(-50%, -50%)';
          dotContainer.style.cursor = 'pointer';
          dotContainer.style.zIndex = '20';
          dotContainer.style.pointerEvents = 'auto';
          // Ensure container doesn't affect label positioning
          dotContainer.style.display = 'flex';
          dotContainer.style.flexDirection = 'column';
          dotContainer.style.alignItems = 'center';

          // Create square marker
          const dot = document.createElement('div');
          const baseSize = 18;
          dot.style.width = baseSize + 'px';
          dot.style.height = baseSize + 'px';
          dot.style.transition = 'all 0.18s ease';
          dot.style.boxShadow = '0 1px 2px rgba(0,0,0,0.12)';
          dot.style.borderRadius = '6px';
          dot.style.display = 'block';
          dot.style.visibility = 'visible';
          dot.style.opacity = '1';
          dot.style.position = 'relative';
          dot.style.zIndex = '21'; // Above the line

          // Colors
          const FILLED_BLUE = '#1E52A6';
          const BORDER_BLUE = '#1E52A6';
          const LIGHT_BLUE = '#a4afc1ff';
          const NON_RICHIESTO_COLOR = '#F6ECE1'; // Color for NON_RICHIESTO

          // Get quorum status (convert year format)
          const yearKey = getYearKeyForQuorum(year);
          const quorumStatus = quorumStatusByYear[yearKey];

          // Apply color based on quorum status
          if (quorumStatus === 'RAGGIUNTO') {
            dot.style.backgroundColor = FILLED_BLUE;
            dot.style.border = `2px solid ${BORDER_BLUE}`;
            dot.style.border = 'none';
          } else if (quorumStatus === 'NON_RICHIESTO') {
            dot.style.backgroundColor = NON_RICHIESTO_COLOR;
            dot.style.border = `2px solid ${BORDER_BLUE}`;
          } else if (quorumStatus === 'NON_RAGGIUNTO') {
            dot.style.backgroundColor = LIGHT_BLUE;
            dot.style.border = 'none';
          } else {
            dot.style.backgroundColor = '#E1E1E1';
            dot.style.border = `2px solid ${BORDER_BLUE}`;
          }

          // Create year label - positioned BELOW the timeline
          // Position label absolutely relative to year-dots container for consistent alignment
          const label = document.createElement('div');
          label.textContent = year;
          label.setAttribute('data-label-year', year);
          label.style.position = 'absolute';
          // Reuse percentage variable already declared above
          label.style.left = `${percentage}%`;
          label.style.transform = 'translateX(-50%)';
          label.style.top = 'calc(50% + 30px)'; // Position relative to timeline center, always same distance
          label.style.fontFamily = "'STIX Two Text', serif";
          label.style.fontSize = '16px';
          label.style.fontWeight = 'bold';
          label.style.whiteSpace = 'nowrap';
          label.style.pointerEvents = 'none'; // Il click viene gestito dal container
          label.style.opacity = '1';
          label.style.lineHeight = '16px'; // Fixed line height
          label.style.height = '16px'; // Fixed height for consistent alignment
          label.style.marginTop = '0';
          label.style.paddingTop = '0';
          label.style.marginBottom = '0';
          label.style.paddingBottom = '0';
          label.style.zIndex = '1'; // Below the line (line has z-index 5)

          // Highlight selected year (only if one is selected)
          if (selectedYearOverview && year === selectedYearOverview) {
            const selectedSize = 22;
            dot.style.width = `${selectedSize}px`;
            dot.style.height = `${selectedSize}px`;
            dot.style.boxShadow = '0 3px 6px rgba(0,0,0,0.25)';
            label.style.opacity = '1';
            label.style.color = '#255077';
          } else {
            label.style.color = '#255096';
          }

          // Hover effects
          dotContainer.addEventListener('mouseenter', () => {
            const hoverSize = 24;
            dot.style.width = `${hoverSize}px`;
            dot.style.height = `${hoverSize}px`;
            dot.style.boxShadow = '0 6px 12px rgba(0,0,0,0.25)';
            dot.style.borderRadius = '6px';
            // Aggiungi tooltip per indicare il click
            dotContainer.title = 'Click per vedere il dettaglio';
          });

          dotContainer.addEventListener('mouseleave', () => {
            if (year !== selectedYearOverview) {
              dot.style.width = '18px';
              dot.style.height = '18px';
              dot.style.boxShadow = '0 1px 2px rgba(0,0,0,0.12)';
            } else {
              dot.style.width = '22px';
              dot.style.height = '22px';
              dot.style.boxShadow = '0 3px 6px rgba(0,0,0,0.25)';
            }
          });

          // Click handler - singolo click per andare al dettaglio
          dotContainer.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // Converti il formato anno da overview a dettaglio
            let yearParam = year;
            if (year === '2016(1)') {
              yearParam = '2016-1';
            } else if (year === '2016(2)') {
              yearParam = '2016-2';
            } else {
              // Per gli altri anni, usa il numero direttamente
              yearParam = year;
            }

            console.log('Click su anno:', year, '-> reindirizzamento a dettaglio.html?year=' + yearParam);

            // Reindirizza alla pagina dettaglio con l'anno come parametro
            window.location.href = `dettaglio.html?year=${encodeURIComponent(yearParam)}`;
          });

          dotContainer.appendChild(dot);
          // Append dotContainer first, then label to maintain proper z-index layering
          yearDots.appendChild(dotContainer);
          // Append label directly to yearDots container for consistent positioning (after dotContainer so it's on top)
          yearDots.appendChild(label);

          // Debug: verify dot is visible
          console.log(`Dot created for ${year}:`, dot, 'Container:', dotContainer);
        });
      };

      // Update dot styles
      const updateDotStyles = () => {
        const dotContainers = yearDots.querySelectorAll('[data-year-key]');
        dotContainers.forEach((container) => {
          const year = container.getAttribute('data-year-key');
          const dot = container.querySelector('div');
          // Find label by data-label-year attribute since it's now in yearDots container
          const label = yearDots.querySelector(`[data-label-year="${year}"]`);

          if (selectedYearOverview && year === selectedYearOverview) {
            dot.style.width = '22px';
            dot.style.height = '22px';
            dot.style.boxShadow = '0 3px 6px rgba(0,0,0,0.25)';
            if (label) {
              label.style.color = '#255077';
              label.style.opacity = '1';
              // Keep label aligned at same position
              label.style.top = 'calc(50% + 30px)';
            }
          } else {
            dot.style.width = '18px';
            dot.style.height = '18px';
            dot.style.boxShadow = '0 1px 2px rgba(0,0,0,0.12)';
            if (label) {
              label.style.color = '#255096';
              label.style.opacity = '1';
              // Keep label aligned at same position
              label.style.top = 'calc(50% + 30px)';
            }
          }
        });
      };

      // Create dots
      createDots();

      // Handle slider change
      let isInitialLoad = true;
      slider.addEventListener('input', (e) => {
        // Skip first load to avoid auto-selecting 2025
        if (isInitialLoad) {
          isInitialLoad = false;
          return;
        }

        const position = parseFloat(e.target.value);
        const year = findClosestYear(position);

        if (year && year !== selectedYearOverview) {
          selectedYearOverview = year;
          updateDotStyles();

          // Snap slider to exact position
          const exactPosition = yearToPosition[selectedYearOverview];
          if (exactPosition !== undefined) {
            slider.value = exactPosition;
          }

          // Don't automatically show percentage when year is selected
          // Percentage will only show on hover
          hoveredIndex = -1;
          redraw();
        }
      });

      // Reset flag after a short delay to allow user interaction
      setTimeout(() => {
        isInitialLoad = false;
      }, 500);
    }

    // Initialize timeline when page loads
    window.addEventListener('load', () => {
      // Wait a bit for p5.js setup to complete
      setTimeout(() => {
        setupYearSliderOverview();
      }, 100);
    });
  </script>
